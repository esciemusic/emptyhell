name: EMPTYHELL Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run preview -- --host 127.0.0.1 > /tmp/emptyhell-preview.log 2>&1 &
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emptyhell-browser-qa
          path: test-results/
