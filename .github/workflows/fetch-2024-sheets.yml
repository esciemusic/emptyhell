name: Fetch current 2024 Parc-Extension sheets

on:
  push:
    paths:
      - ".github/workflows/fetch-2024-sheets.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official 2024 PDF archive
        run: |
          set -euo pipefail
          mkdir -p carto_2024/selected
          curl -fL --retry 3 --retry-all-errors \
            -A "Mozilla/5.0 EMPTYHELL-geography-reconciliation" \
            "https://donnees.montreal.ca/fr/dataset/c9336648-098a-4984-b0cb-be65b951cadd/resource/bc1a8fd8-5208-4903-99ae-a06056c7d5b5/download/compilation_carto_2024_pdf.zip" \
            -o carto_2024/compilation_carto_2024_pdf.zip

      - name: Extract first-sector sheets
        run: |
          set -euo pipefail
          unzip -l carto_2024/compilation_carto_2024_pdf.zip \
            | grep -E "31H12-010-(0431|0530|0531|0630|0631).*\\.pdf" \
            | tee carto_2024/target_index.txt
          while read -r line; do
            file=$(echo "$line" | awk '{print $NF}')
            [ -n "$file" ] || continue
            unzip -p carto_2024/compilation_carto_2024_pdf.zip "$file" > "carto_2024/selected/$(basename "$file")"
          done < carto_2024/target_index.txt
          find carto_2024/selected -maxdepth 1 -type f -print

      - name: Upload selected current sheets
        uses: actions/upload-artifact@v4
        with:
          name: parc-extension-2024-sheets
          if-no-files-found: error
          path: |
            carto_2024/target_index.txt
            carto_2024/selected/*.pdf
