              wc -c sqrc_1000.geojson
              echo "SQRC_DOWNLOAD=success" >> "\$GITHUB_OUTPUT"
              exit 0
            fi
            rm -f sqrc_1000.geojson
          done
          echo "SQRC_DOWNLOAD=blocked" >> "\$GITHUB_OUTPUT"
          echo "Official SQRC download endpoints are blocked from this GitHub runner; continuing so independent railway extraction can run."

