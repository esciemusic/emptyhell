name: Fetch SQRC 1:1000 source

on:
  push:
    paths:
      - ".github/workflows/fetch-sqrc.yml"
  workflow_dispatch:

jobs:
  fetch-sqrc:
    runs-on: ubuntu-latest
    steps:
      - name: Download SQRC 1:1000 GeoJSON
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors \
            "https://donnees.montreal.ca/fr/dataset/e160983c-f5d2-49ec-9b81-d0f6fb66518a/resource/ad1924d4-2579-40aa-8aa7-b83d88166ee5/download/sqrc_1000.geojson" \
            -o sqrc_1000.geojson
          test -s sqrc_1000.geojson
          wc -c sqrc_1000.geojson

      - name: Inspect grid and identify sheets around Parc du Centenaire
        run: |
          python -m pip install --quiet pyproj shapely
          python - <<'PY'
          import json
          from pathlib import Path
          from pyproj import Transformer
          from shapely.geometry import shape, Point

          data = json.loads(Path("sqrc_1000.geojson").read_text())
          features = data.get("features", [])
          print("feature_count=", len(features))
          print("top_level_keys=", sorted(data.keys()))
          if features:
              print("property_keys=", sorted(features[0].get("properties", {}).keys()))
              print("sample_properties=", features[0].get("properties"))

          # Official Parc du Centenaire-de-Parc-Extension point:
          # 45.526943, -73.630554
          transformer = Transformer.from_crs("EPSG:4326", "EPSG:32188", always_xy=True)
          x, y = transformer.transform(-73.630554, 45.526943)
          print("park_mtm8=", x, y)

          p = Point(x, y)
          matches = []
          for f in features:
              geom = shape(f["geometry"])
              if geom.contains(p) or geom.touches(p) or geom.distance(p) < 1:
                  matches.append(f)

          print("containing_or_touching_sheets=", len(matches))
          for f in matches:
              print(json.dumps(f.get("properties", {}), ensure_ascii=False, sort_keys=True))

          # Also report nearby sheets within 500 m, useful if the park sits on a sheet edge.
          nearby = []
          for f in features:
              geom = shape(f["geometry"])
              d = geom.distance(p)
              if d <= 500:
                  nearby.append((d, f.get("properties", {})))
          print("nearby_sheets_500m=", len(nearby))
          for d, props in sorted(nearby, key=lambda z: z[0])[:20]:
              print("distance_m=", round(d, 2), "properties=", json.dumps(props, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload source and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: sqrc-1000-source
          path: |
            sqrc_1000.geojson
