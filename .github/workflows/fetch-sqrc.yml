name: Fetch railway reconciliation source

on:
  push:
    paths:
      - ".github/workflows/fetch-sqrc.yml"
  workflow_dispatch:

jobs:
  railway:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Montréal railway archive
        run: |
          set -euo pipefail
          mkdir -p source extract
          curl -fL --retry 3 --retry-all-errors \
            -A "Mozilla/5.0 EMPTYHELL-geography-reconciliation" \
            "https://donnees.montreal.ca/fr/dataset/e135b6df-5bfc-43bc-a743-5f306c8900fb/resource/fe46cc87-f2d2-4b2d-9134-9e0dc431f21c/download/voies-ferrees-2020.zip" \
            -o source/voies-ferrees-2020.zip
          unzip -q source/voies-ferrees-2020.zip -d extract

      - name: Extract railway track linework
        run: |
          set -euo pipefail
          python -m pip install --quiet pyshp pyproj shapely
          python - <<'PY'
          import json
          from pathlib import Path
          import shapefile
          from pyproj import Transformer
          from shapely.geometry import box, mapping, shape
          from shapely.ops import transform

          target_wgs84 = box(-73.645, 45.515, -73.610, 45.540)
          to_source = Transformer.from_crs("EPSG:4326", "EPSG:32188", always_xy=True)
          to_wgs84 = Transformer.from_crs("EPSG:32188", "EPSG:4326", always_xy=True)
          target_source = transform(to_source.transform, target_wgs84)

          features = []
          inventories = []

          for shp in Path("extract").rglob("*.shp"):
              reader = shapefile.Reader(str(shp))
              fields = [f[0] for f in reader.fields[1:]]
              inventories.append({
                  "path": str(shp),
                  "shape_type": reader.shapeType,
                  "records": len(reader),
                  "fields": fields,
                  "bounds": reader.bbox,
              })
              if "voie" not in shp.stem.lower() or reader.shapeType not in (3, 13, 23):
                  continue
              for row in reader.iterShapeRecords():
                  geom = shape(row.shape.__geo_interface__)
                  if not geom.intersects(target_source):
                      continue
                  props = dict(zip(fields, row.record))
                  features.append({
                      "type": "Feature",
                      "properties": props,
                      "geometry": mapping(transform(to_wgs84.transform, geom)),
                  })

          Path("railway_parc_extension.geojson").write_text(
              json.dumps({"type":"FeatureCollection","features":features}, ensure_ascii=False)
          )
          Path("railway_source_inventory.json").write_text(
              json.dumps({"source_crs":"EPSG:32188","files":inventories,"selected_features":len(features)}, ensure_ascii=False, indent=2)
          )
          print("selected railway features:", len(features))
          PY

      - name: Build reconciliation report
        run: |
          set -euo pipefail
          python -m pip install --quiet pyproj shapely
          python - <<'PY'
          import json
          from pathlib import Path
          from pyproj import Transformer
          from shapely.geometry import Point, shape
          from shapely.ops import transform

          data=json.loads(Path("railway_parc_extension.geojson").read_text())
          to_mtm8=Transformer.from_crs("EPSG:4326","EPSG:32188",always_xy=True)
          park=Point(*to_mtm8.transform(-73.630554,45.526943))
          station=Point(*to_mtm8.transform(-73.62467,45.53164))
          rows=[]
          for f in data["features"]:
              g=transform(to_mtm8.transform,shape(f["geometry"]))
              p=f.get("properties",{})
              rows.append({
                  "objectid":p.get("OBJECTID"),
                  "distance_to_park_m":round(g.distance(park),2),
                  "distance_to_gare_parc_m":round(g.distance(station),2),
                  "properties":p
              })
          rows.sort(key=lambda x:x["distance_to_park_m"])
          report={
              "source":"Ville de Montréal — Voies ferrées 3D (2020)",
              "dataset_id":"e135b6df-5bfc-43bc-a743-5f306c8900fb",
              "source_crs":"EPSG:32188",
              "target_bbox_wgs84":[-73.645,45.515,-73.610,45.540],
              "park_wgs84":[45.526943,-73.630554],
              "gare_parc_wgs84":[45.53164,-73.62467],
              "feature_count":len(rows),
              "nearest_segments":rows[:20]
          }
          Path("railway_parc_extension_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({"feature_count":len(rows),"nearest":rows[:5]},ensure_ascii=False,indent=2))
          PY

      - name: Upload verified railway extraction
        uses: actions/upload-artifact@v4
        with:
          name: railway-reconciliation
          if-no-files-found: error
          path: |
            railway_parc_extension.geojson
            railway_parc_extension_report.json
            railway_source_inventory.json
